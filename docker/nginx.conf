server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # Docker DNS. Resolve at request time so nginx still starts if ingest is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/ingest {
        set $ingest_upstream http://ingest:8000;
        proxy_pass $ingest_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
